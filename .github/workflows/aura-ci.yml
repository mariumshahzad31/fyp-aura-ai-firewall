name: aura-ci
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install platform extras
        run: pip install -r requirements-platform.txt || true
      - name: Syntax check platform package
        run: python -m compileall -q api config platform utils
      - name: Import extended app (cold)
        run: python -c "import platform.asgi_extended as m; assert m.app is not None"
