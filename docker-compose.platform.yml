services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"

  aura-api-platform:
    build: .
    image: aura:latest
    command: uvicorn platform.asgi_extended:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      AURA_JWT_SECRET: ${AURA_JWT_SECRET:-change-me-in-prod}
      AURA_ADMIN_PASSWORD: ${AURA_ADMIN_PASSWORD:-admin}
      AURA_USER_PASSWORD: ${AURA_USER_PASSWORD:-analyst}
      AURA_PLATFORM_MULTITENANT: "true"
      AURA_PLATFORM_ZERO_TRUST: "true"
      AURA_SERVICE_TOKEN_SECRET: ${AURA_SERVICE_TOKEN_SECRET:-aura-service-shared-secret-min-16}
      AURA_STREAMING_ENABLED: "true"
      AURA_TRANSFORMER_PARALLEL: ${AURA_TRANSFORMER_PARALLEL:-false}
      AURA_GRAPH_DETECTION: "true"
      AURA_KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      - kafka

  aura-spark-stream:
    build:
      context: .
      dockerfile: Dockerfile.spark
    environment:
      AURA_KAFKA_BOOTSTRAP: kafka:9092
      AURA_SPARK_CHECKPOINT: /tmp/aura-stream-checkpoint
    depends_on:
      - kafka

networks:
  default:
    name: aura-platform-net
